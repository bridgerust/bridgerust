[package]
name = "embex-bench"
version = "0.1.0"
edition = "2021"
publish = false

[features]
default = []
lancedb = ["bridge-embex/lancedb", "bridge-embex-infrastructure/lancedb"]
qdrant = ["bridge-embex/qdrant", "bridge-embex-infrastructure/qdrant"]
weaviate = ["bridge-embex/weaviate", "bridge-embex-infrastructure/weaviate"]

[dependencies]
bridge-embex = { path = "../../crates/embex/client", features = ["all"] }
bridge-embex-core = { path = "../../crates/embex/core" }
bridge-embex-infrastructure = { path = "../../crates/embex/infrastructure", features = ["all"] }
bridge-core = { path = "../../crates/core", features = ["simd"] }
tokio = { version = "1.48", features = ["full", "rt-multi-thread"] }
criterion = { version = "0.8.1", features = ["async_tokio"] }
rand = "0.9.2"
tempfile = "3.24.0"
serde_json = "1.0.147"
futures = "0.3.31"

[[bench]]
name = "lancedb_bench"
harness = false

[[bench]]
name = "overhead_bench"
harness = false

[[bench]]
name = "native_comparison"
harness = false

[[bench]]
name = "simd_bench"
harness = false

[[bench]]
name = "simd_comparison"
harness = false
