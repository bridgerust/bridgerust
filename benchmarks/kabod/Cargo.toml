[package]
name = "kabod-bench"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
bridge-kabod = { path = "../../crates/kabod" }
tokio = { version = "1.48", features = ["full", "rt-multi-thread"] }
criterion = { version = "0.8.1", features = ["async_tokio"] }
rand = "0.9.2"
tempfile = "3.24.0"
serde_json = "1.0.147"
futures = "0.3.31"

[[bench]]
name = "lancedb_bench"
harness = false

[[bench]]
name = "overhead_bench"
harness = false
