[package]
name = "bridgerust-cli"
version = "0.1.0"
edition = "2021"
description = "Command Line Interface for BridgeRust framework"
authors = ["BridgeRust Team"]
license = "MIT OR Apache-2.0"

[[bin]]
name = "bridge"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5.54", features = ["derive"] }
tokio = { version = "1.49.0", features = ["full"] }
anyhow = "1.0.100"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.148"
toml = "0.9.8"
console = "0.16.2"
dialoguer = "0.12.0"
indicatif = "0.18.3"
walkdir = "2.5.0"
regex = "1.12.2"
dirs = "6.0.0"
notify = "8.2.0"

