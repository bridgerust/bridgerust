[package]
name = "bridge-date-parity"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "BridgeRust compatibility pilot for a date normalization module"
publish = false

[lib]
name = "bridge_date_parity"
crate-type = ["cdylib", "rlib"]

[features]
default = []
python = ["dep:pyo3", "bridgerust/python"]
nodejs = ["dep:napi", "dep:napi-derive", "bridgerust/nodejs"]

[dependencies]
bridgerust = { path = "../../crates/bridgerust", version = "0.1" }
chrono = { version = "0.4.42", default-features = false, features = ["std"] }
serde_json = "1.0.147"
pyo3 = { version = "0.27.2", optional = true, features = ["extension-module"] }
napi = { version = "3.7.1", optional = true }
napi-derive = { version = "3.4.1", optional = true }

[build-dependencies]
napi-build = "2.3.1"
