[package]
name = "bridgerust-example"
version = "0.1.0"
edition = "2021"
description = "Comprehensive BridgeRust example project"
authors = ["BridgeRust Team"]
license = "MIT OR Apache-2.0"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
bridgerust = { path = "../../crates/bridgerust", version = "0.1" }

[features]
default = []
python = ["dep:pyo3", "bridgerust/python"]
nodejs = ["dep:napi", "dep:napi-derive", "bridgerust/nodejs"]

[dependencies.pyo3]
version = "0.27.2"
optional = true
features = ["extension-module"]

[dependencies.napi]
version = "3"
optional = true

[dependencies.napi-derive]
version = "3"
optional = true

