services:
  # ========== Qdrant ==========
  qdrant:
    image: qdrant/qdrant:latest
    container_name: kabod-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      - QDRANT__SERVICE__GRPC_PORT=6334

  # ========== Chroma ==========
  chroma:
    image: chromadb/chroma:latest
    container_name: kabod-chroma
    ports:
      - "8000:8000"
    volumes:
      - chroma_data:/chroma/chroma
    environment:
      - IS_PERSISTENT=TRUE
      - ANONYMIZED_TELEMETRY=FALSE

  # ========== Weaviate ==========
  weaviate:
    image: semitechnologies/weaviate:latest
    container_name: kabod-weaviate
    ports:
      - "8080:8080"
      - "50051:50051"
    volumes:
      - weaviate_data:/var/lib/weaviate
    environment:
      - QUERY_DEFAULTS_LIMIT=25
      - AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED=true
      - PERSISTENCE_DATA_PATH=/var/lib/weaviate
      - DEFAULT_VECTORIZER_MODULE=none
      - CLUSTER_HOSTNAME=node1

  # ========== Milvus (Standalone) ==========
  etcd:
    image: quay.io/coreos/etcd:v3.5.5
    container_name: kabod-milvus-etcd
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    volumes:
      - etcd_data:/etcd
    command: etcd -advertise-client-urls=http://127.0.0.1:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd

  minio:
    image: minio/minio:RELEASE.2023-03-20T20-16-18Z
    container_name: kabod-milvus-minio
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    ports:
      - "9001:9001"
      - "9000:9000"
    volumes:
      - minio_data:/minio_data
    command: minio server /minio_data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  milvus:
    image: milvusdb/milvus:v2.4.5
    container_name: kabod-milvus
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    volumes:
      - milvus_data:/var/lib/milvus
    ports:
      - "19530:19530"
      - "9091:9091"
    depends_on:
      - etcd
      - minio

  # ========== PostgreSQL + pgvector ==========
  postgres:
    image: pgvector/pgvector:pg16
    container_name: kabod-pgvector
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: kabod
      POSTGRES_PASSWORD: kabod_test
      POSTGRES_DB: kabod_test
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # ========== LanceDB ==========
  # LanceDB is embedded, no server needed. We'll test it in-process.

  # ========== Pinecone ==========
  # Pinecone is a managed service - requires API key for real testing
  # We can use a mock server for CI, or skip in local testing

volumes:
  qdrant_data:
  chroma_data:
  weaviate_data:
  etcd_data:
  minio_data:
  milvus_data:
  postgres_data:
