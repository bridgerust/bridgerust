[build-system]
requires = ["maturin>=1.4,<2.0"]
build-backend = "maturin"

[project]
name = "bridgeq"
version = "0.1.18"
description = "BridgeQ: Rust-powered queue toolkit for Python"
readme = "README.md"
authors = [{ name = "BridgeRust", email = "hello@kologojosias.com" }]
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
]

[project.urls]
Homepage = "https://github.com/bridgerust/bridgerust"
Repository = "https://github.com/bridgerust/bridgerust"
Issues = "https://github.com/bridgerust/bridgerust/issues"

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.maturin]
manifest-path = "Cargo.toml"
module-name = "bridgeq"
profile = "release"
strip = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"
