[package]
name = "kabod-node"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "3.7.1", features = ["async", "serde-json"] }
napi-derive = "3.4.1"
serde_json = "1.0.147"
bridge-kabod = { path = "../../../../crates/kabod" }
tokio = { version = "1.48.0", features = ["full"] }

[build-dependencies]
napi-build = "2.3.1"
