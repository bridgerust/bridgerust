[package]
name = "kabod-node"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[features]
default = ["all"]
all = ["qdrant", "pinecone", "chroma", "lancedb", "pgvector"]
qdrant = ["bridge-kabod/qdrant"]
pinecone = ["bridge-kabod/pinecone"]
chroma = ["bridge-kabod/chroma"]
lancedb = ["bridge-kabod/lancedb"]
pgvector = ["bridge-kabod/pgvector"]

[dependencies]
napi = { version = "3.7.1", features = ["async", "serde-json"] }
napi-derive = "3.4.1"
serde_json = "1.0"
async-trait = "0.1.89"
bridge-kabod = { path = "../../../../crates/kabod/client", default-features = false, features = ["all"] }
tokio = { version = "1.48.0", features = ["full"] }

[build-dependencies]
napi-build = "2.3.1"
