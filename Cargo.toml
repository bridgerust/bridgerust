[workspace]
resolver = "3"
members = [
    "crates/core",
    "crates/schema",
    "crates/kabod/client",
    "crates/kabod/core",
    "crates/kabod/infrastructure",
    "crates/kabod/adapters/qdrant",
    "crates/kabod/adapters/pinecone",
    "crates/kabod/adapters/chroma",
    "crates/kabod/adapters/lancedb",
    "crates/kabod/adapters/pgvector",
    "bindings/python/bridge-schema",
    "bindings/python/kabod",
    "bindings/node/@bridgerust/kabod",
    "benchmarks/kabod",
    "crates/kabod/adapters/weaviate",
    "crates/kabod/adapters/milvus"
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
license = "MIT OR Apache-2.0"
repository = "https://github.com/bridgerust/bridgerust"
authors = ["KOLOGO B Josias Yannick <hello@kologojosias.com>"]
