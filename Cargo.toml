[workspace]
resolver = "3"
members = [
    "crates/core",
    "crates/bridgerust",
    "crates/bridgerust-macros",
    "crates/poc",
    # "crates/schema",  # Temporarily disabled - not ready yet
    "crates/embex/client",
    "crates/embex/core",
    "crates/embex/infrastructure",
    "crates/embex/adapters/qdrant",
    "crates/embex/adapters/pinecone",
    "crates/embex/adapters/chroma",
    "crates/embex/adapters/lancedb",
    "crates/embex/adapters/pgvector",
    "crates/embex/bridge",
    # "bindings/python/bridge-schema",  # Temporarily disabled - not ready yet
    "bindings/python/embex",
    "bindings/node/@bridgerust/embex",
    "benchmarks/embex",
    "crates/embex/adapters/weaviate",
    "crates/embex/adapters/milvus",
    "cli/embex-cli",
    "cli/bridge",
    "examples/rust",
    "examples/bridgerust-example",
    "tests/e2e",
]

[workspace.package]
version = "0.1.16"
edition = "2024"
rust-version = "1.92"
license = "MIT OR Apache-2.0"
repository = "https://github.com/bridgerust/bridgerust"
authors = ["KOLOGO B Josias Yannick <hello@kologojosias.com>"]

# Optimize release builds for size
[profile.release]
opt-level = 3           # Maximum optimizations
lto = true              # Link-time optimization
codegen-units = 1       # Better optimization, slower compile
strip = true            # CRITICAL: Strip debug symbols
panic = 'abort'         # Smaller binaries
debug = false           # No debug info

# Apply to all workspace packages
[profile.release.package."*"]
opt-level = 3
strip = true
