[workspace]
resolver = "3"
members = [
    "crates/core",
    "crates/schema",
    "crates/embex/client",
    "crates/embex/core",
    "crates/embex/infrastructure",
    "crates/embex/adapters/qdrant",
    "crates/embex/adapters/pinecone",
    "crates/embex/adapters/chroma",
    "crates/embex/adapters/lancedb",
    "crates/embex/adapters/pgvector",
    "bindings/python/bridge-schema",
    "bindings/python/embex",
    "bindings/node/@bridgerust/embex",
    "benchmarks/embex",
    "crates/embex/adapters/weaviate",
    "crates/embex/adapters/milvus",
    "cli/embex-cli"
]

[workspace.package]
version = "0.1.1"
edition = "2024"
rust-version = "1.92"
license = "MIT OR Apache-2.0"
repository = "https://github.com/bridgerust/bridgerust"
authors = ["KOLOGO B Josias Yannick <hello@kologojosias.com>"]
