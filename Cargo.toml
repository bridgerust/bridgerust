[workspace]
resolver = "3"
members = [
    "crates/core",
    "crates/bridgerust",
    "crates/bridgerust-macros",
    "crates/poc",
    "crates/schema",
    "crates/bridgeq",
    "crates/bridgeq-redis",
    "crates/bridgeq-postgres",
    "crates/embex/client",
    "crates/embex/core",
    "crates/embex/infrastructure",
    "crates/embex/adapters/qdrant",
    "crates/embex/adapters/pinecone",
    "crates/embex/adapters/chroma",
    "crates/embex/adapters/lancedb",
    "crates/embex/adapters/pgvector",
    "crates/embex/adapters/elasticsearch",
    "crates/embex/adapters/opensearch",
    "crates/embex/adapters/redis",
    "crates/embex/bridge",
    "crates/bridgetime/bridge",
    # "bindings/python/bridge-schema",  # Temporarily disabled - not ready yet
    "bindings/python/embex",
    "bindings/python/bridgeq",
    "bindings/node/@bridgerust/embex",
    "bindings/node/@bridgerust/bridgeq",
    "benchmarks/embex",
    "crates/embex/adapters/weaviate",
    "crates/embex/adapters/milvus",
    "cli/embex-cli",
    "cli/bridge",
    "examples/rust",
    "examples/bridgerust-example",
    "tests/e2e",
]

[workspace.package]
version = "0.1.17"
edition = "2024"
rust-version = "1.92"
license = "MIT OR Apache-2.0"
repository = "https://github.com/bridgerust/bridgerust"
authors = ["KOLOGO B Josias Yannick <hello@kologojosias.com>"]
homepage = "https://bridgerust.dev"

# Optimize release builds for size
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = 'abort'
debug = false

# Apply to all workspace packages
[profile.release.package."*"]
opt-level = 3
strip = true
