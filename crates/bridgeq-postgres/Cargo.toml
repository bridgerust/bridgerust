[package]
name = "bridgeq-postgres"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Durable PostgreSQL adapter for bridgeq"

[dependencies]
bridgeq = { path = "../bridgeq" }
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio-rustls", "postgres"] }
thiserror = "2.0.17"

[dev-dependencies]
tokio = { version = "1.48", features = ["rt-multi-thread", "macros", "time"] }
