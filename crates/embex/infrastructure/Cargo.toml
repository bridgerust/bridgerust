[package]
name = "bridge-embex-infrastructure"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Infrastructure layer for Embex (observability, retry, config, adapter factory)"

[features]
default = ["all"]
all = ["qdrant", "pinecone", "chroma", "lancedb", "pgvector", "weaviate", "milvus"]

# Individual adapters
qdrant = ["dep:bridge-embex-qdrant"]
pinecone = ["dep:bridge-embex-pinecone"]
chroma = ["dep:bridge-embex-chroma"]
lancedb = ["dep:bridge-embex-lancedb"]
pgvector = ["dep:bridge-embex-pgvector"]
weaviate = ["dep:bridge-embex-weaviate"]
milvus = ["dep:bridge-embex-milvus"]

[dependencies]
bridge-embex-core = { path = "../core" }
anyhow = "1.0.100"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.147"
config = "0.15.19"
tokio = { version = "1.48", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["env-filter", "fmt"], optional = true }

# Optional adapter crates
bridge-embex-qdrant = { path = "../adapters/qdrant", optional = true }
bridge-embex-pinecone = { path = "../adapters/pinecone", optional = true }
bridge-embex-chroma = { path = "../adapters/chroma", optional = true }
bridge-embex-lancedb = { path = "../adapters/lancedb", optional = true }
bridge-embex-pgvector = { path = "../adapters/pgvector", optional = true }
bridge-embex-weaviate = { path = "../adapters/weaviate", optional = true }
bridge-embex-milvus = { path = "../adapters/milvus", optional = true }

[dev-dependencies]
tokio-test = "0.4.4"
bridge-embex = { path = "../client", features = ["all"] }
tempfile = "3.24.0"

[[test]]
name = "pooling_test"
path = "tests/pooling_test.rs"

[[test]]
name = "observability_test"
path = "tests/observability_test.rs"

[[test]]
name = "integration_observability_test"
path = "tests/integration_observability_test.rs"

