[package]
name = "bridgerust-macros"
version = "0.1.0"
edition.workspace = true
description = "Procedural macros for BridgeRust framework"
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"

[lib]
proc-macro = true

[[example]]
name = "error_example"
path = "examples/error_example.rs"

[dependencies]
syn = { version = "2.0", features = ["full"] }
quote = "1.0"
proc-macro2 = "1.0"

[dev-dependencies]
trybuild = "1.0"
bridgerust = { path = "../bridgerust", features = [] }
