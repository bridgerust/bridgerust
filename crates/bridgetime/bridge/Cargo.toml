[package]
name = "bridgetime-bridge"
version = "0.2.1"
edition.workspace = true
description = "BridgeTime: Rust-powered Day.js/Moment-style datetime library for Python and Node.js"
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords = ["datetime", "timezone", "python", "nodejs", "bridgerust"]
categories = ["date-and-time", "api-bindings"]

[lib]
name = "bridgetime"
crate-type = ["cdylib", "rlib"]

[features]
default = []
python = ["dep:pyo3", "bridgerust/python"]
nodejs = ["dep:napi", "dep:napi-derive", "bridgerust/nodejs"]

[dependencies]
bridgerust = { path = "../../bridgerust", version = "0.1.2" }
chrono = { version = "0.4.42", default-features = true }
chrono-tz = "0.10.4"

[dependencies.pyo3]
version = "0.27.2"
optional = true
features = ["extension-module"]

[dependencies.napi]
version = "3.7.1"
optional = true

[dependencies.napi-derive]
version = "3.4.1"
optional = true

[build-dependencies]
napi-build = "2.3.1"
