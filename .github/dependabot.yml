version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "monthly" # Changed from weekly to monthly
    open-pull-requests-limit: 5 # Reduced from 10
    labels:
      - "dependencies"
      - "rust"
    commit-message:
      prefix: "chore"
      include: "scope"

  # Python dependencies
  - package-ecosystem: "pip"
    directory: "/bindings/python/embex"
    schedule:
      interval: "monthly" # Changed from weekly to monthly
    open-pull-requests-limit: 3 # Reduced from 5
    labels:
      - "dependencies"
      - "python"
    commit-message:
      prefix: "chore"
      include: "scope"

  # Node.js dependencies
  - package-ecosystem: "npm"
    directory: "/bindings/node/@bridgerust/embex"
    schedule:
      interval: "monthly" # Changed from weekly to monthly
    open-pull-requests-limit: 3 # Reduced from 5
    labels:
      - "dependencies"
      - "nodejs"
    commit-message:
      prefix: "chore"
      include: "scope"

  # GitHub Actions
  # Keep weekly for security updates to CI/CD tools
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3 # Reduced from 5
    labels:
      - "dependencies"
      - "ci/cd"
    commit-message:
      prefix: "ci"
      include: "scope"
