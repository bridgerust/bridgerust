name: Test Published Packages

on:
  workflow_dispatch:
    inputs:
      npm_version:
        description: "npm package version to test (leave empty for latest)"
        required: false
        type: string
      pypi_version:
        description: "PyPI package version to test (leave empty for latest)"
        required: false
        type: string
  schedule:
    # Run daily at 2 AM UTC to catch any issues with published packages
    - cron: "0 2 * * *"

env:
  CARGO_TERM_COLOR: always

jobs:
  test-npm:
    name: Test npm Package
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node-version: ["18", "20", "22"]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Create test directory
        shell: bash
        run: |
          mkdir -p test-npm-package
          cd test-npm-package

      - name: Initialize npm project
        working-directory: test-npm-package
        run: |
          npm init -y
          echo "[OK] npm project initialized"

      - name: Install @bridgerust/embex from npm
        working-directory: test-npm-package
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.npm_version }}" ]; then
            npm install @bridgerust/embex@${{ github.event.inputs.npm_version }}
          else
            npm install @bridgerust/embex
          fi
          echo "[OK] Package installed from npm"

      - name: Verify package installation
        working-directory: test-npm-package
        shell: bash
        run: |
          echo "[INFO] Installed package info:"
          npm list @bridgerust/embex
          echo ""
          echo "[INFO] Package contents:"
          ls -la node_modules/@bridgerust/embex/ || dir node_modules\@bridgerust\embex\

      - name: Check package structure
        working-directory: test-npm-package
        shell: bash
        run: |
          cat > check-package.js << 'EOF'
          const fs = require('fs');
          const path = require('path');

          try {
            const packagePath = require.resolve('@bridgerust/embex/package.json');
            const packageDir = path.dirname(packagePath);
            const packageJson = require(packagePath);
            
            console.log('[INFO] Package information:');
            console.log('   - Main entry:', packageJson.main);
            console.log('   - Types entry:', packageJson.types);
            console.log('   - Package directory:', packageDir);
            
            console.log('\n[INFO] Package contents:');
            const files = fs.readdirSync(packageDir);
            files.forEach(file => {
              const filePath = path.join(packageDir, file);
              const stat = fs.statSync(filePath);
              if (stat.isDirectory()) {
                console.log(`   [DIR] ${file}/`);
              } else {
                console.log(`   [FILE] ${file}`);
              }
            });
            
            // Check for dist folder
            const distPath = path.join(packageDir, 'dist');
            if (fs.existsSync(distPath)) {
              console.log('\n[INFO] dist/ folder exists');
            } else {
              console.log('\n[WARN]  dist/ folder not found - this may cause import issues');
            }
            
            // Check main entry point
            if (packageJson.main) {
              const mainPath = path.join(packageDir, packageJson.main);
              if (fs.existsSync(mainPath)) {
                console.log(`\n[OK] Main entry point exists: ${packageJson.main}`);
              } else {
                console.log(`\n[ERR] Main entry point missing: ${packageJson.main}`);
                console.log('   This indicates the package may not be properly built.');
              }
            }
            
            // Check types entry point
            if (packageJson.types) {
              const typesPath = path.join(packageDir, packageJson.types);
              if (fs.existsSync(typesPath)) {
                console.log(`[OK] Types entry point exists: ${packageJson.types}`);
              } else {
                console.log(`[WARN]  Types entry point missing: ${packageJson.types}`);
                console.log('   TypeScript users may not get proper type definitions.');
              }
            }
          } catch (error) {
            console.error('[ERR] Error checking package:', error.message);
            process.exit(1);
          }
          EOF
          node check-package.js

      - name: Create test script
        working-directory: test-npm-package
        shell: bash
        run: |
          cat > test-package.js << 'EOF'
          const fs = require('fs');
          const path = require('path');

          // Helper to run async tests
          async function runAsyncTests() {
            // This will be called after sync tests
          }

          console.log('[TEST] Testing @bridgerust/embex package...\n');

          // Test 1: Try to require the package
          let EmbexClient;
          try {
            const packagePath = require.resolve('@bridgerust/embex/package.json');
            const packageDir = path.dirname(packagePath);
            const packageJson = require(packagePath);
            
            // Try to require using the main entry point
            if (packageJson.main) {
              const mainPath = path.join(packageDir, packageJson.main);
              if (fs.existsSync(mainPath)) {
                const pkg = require('@bridgerust/embex');
                if (!pkg.EmbexClient) {
                  throw new Error(`Package imported but EmbexClient not found. Available exports: ${Object.keys(pkg).join(', ')}`);
                }
                EmbexClient = pkg.EmbexClient;
                console.log('[OK] Test 1: Import successful via main entry');
                console.log(`   - Found exports: ${Object.keys(pkg).join(', ')}`);
              } else {
                // Try alternative entry points
                console.log('[WARN]  Main entry not found, trying alternatives...');
                try {
                  const pkg = require('@bridgerust/embex');
                  if (!pkg.EmbexClient) {
                    throw new Error(`Package imported but EmbexClient not found. Available exports: ${Object.keys(pkg).join(', ')}`);
                  }
                  EmbexClient = pkg.EmbexClient;
                  console.log('[OK] Test 1: Import successful via alternative');
                } catch (e) {
                  throw new Error(`Cannot import package. Main entry (${packageJson.main}) not found. Error: ${e.message}`);
                }
              }
            } else {
              const pkg = require('@bridgerust/embex');
              if (!pkg.EmbexClient) {
                throw new Error(`Package imported but EmbexClient not found. Available exports: ${Object.keys(pkg).join(', ')}`);
              }
              EmbexClient = pkg.EmbexClient;
              console.log('[OK] Test 1: Import successful');
              // Check DataMigrator
              if (!pkg.DataMigrator) {
                 throw new Error(`Package imported but DataMigrator not found.`);
              }
              console.log('[OK] DataMigrator exported');
            }
          } catch (error) {
            console.error('[ERR] Test 1 failed:', error.message);
            console.error('   This might indicate the package is missing required files.');
            console.error('   Check that dist/ folder is built and included in the published package.');
            process.exit(1);
          }

          // Test 2: Client can be instantiated
          try {
            const client = new EmbexClient('qdrant', 'http://localhost:6333', null);
            console.log('[OK] Test 2: Client instantiation successful');
            console.log('   - Client type:', typeof client);
            console.log('   - Has collection method:', typeof client.collection === 'function');
          } catch (error) {
            console.error('[ERR] Test 2 failed:', error.message);
            process.exit(1);
          }

          // Test 3: Collection can be created
          try {
            const client = new EmbexClient('qdrant', 'http://localhost:6333', null);
            const collection = client.collection('test_collection');
            console.log('[OK] Test 3: Collection creation successful');
            console.log('   - Collection type:', typeof collection);
            console.log('   - Has insert method:', typeof collection.insert === 'function');
            console.log('   - Has search method:', typeof collection.search === 'function');
            console.log('   - Has query method:', typeof collection.query === 'function');
            console.log('   - Has scroll method:', typeof collection.scroll === 'function');
          } catch (error) {
            console.error('[ERR] Test 3 failed:', error.message);
            process.exit(1);
          }

          // Test 4: Check package structure
          try {
            const packagePath = require.resolve('@bridgerust/embex/package.json');
            const packageDir = path.dirname(packagePath);
            console.log('[OK] Test 4: Package structure verified');
            console.log('   - Package path:', packageDir);
          } catch (error) {
            console.error('[ERR] Test 4 failed:', error.message);
            process.exit(1);
          }

          // Test 5: Check async initialization method exists
          try {
            if (typeof EmbexClient.newAsync !== 'function') {
              throw new Error('EmbexClient.newAsync is not a function');
            }
            console.log('[OK] Test 5: Async initialization method exists');
            console.log('   - newAsync type:', typeof EmbexClient.newAsync);
          } catch (error) {
            console.error('[ERR] Test 5 failed:', error.message);
            process.exit(1);
          }

          // Test 6: Test async initialization (syntax check, no actual connection)
          try {
            // Test that newAsync returns a Promise
            const clientPromise = EmbexClient.newAsync('lancedb', './test-data', null);
            if (!(clientPromise instanceof Promise)) {
              throw new Error('newAsync does not return a Promise');
            }
            console.log('[OK] Test 6: Async initialization syntax correct');
            console.log('   - newAsync returns Promise');
            console.log('   - Method signature is correct');
            
            // Note: We don't await here to avoid hanging, but we've verified the Promise exists
            // In a real scenario with a DB, this would work: const client = await EmbexClient.newAsync(...)
          } catch (error) {
            console.error('[ERR] Test 6 failed:', error.message);
            process.exit(1);
          }

          console.log('\n[DONE] All basic tests passed!');
          console.log('\n[NOTE] Note: Full integration tests require a running database server.');
          console.log('   To test with a real database, start Qdrant:');
          console.log('   docker run -p 6333:6333 qdrant/qdrant');
          EOF
          cat test-package.js

      - name: Run npm package tests
        working-directory: test-npm-package
        shell: bash
        run: |
          node test-package.js || (sleep 2 && exit 1)

      - name: Test TypeScript usage (if available)
        working-directory: test-npm-package
        shell: bash
        run: |
          if command -v npx &> /dev/null; then
            npm install --save-dev typescript @types/node || true
            cat > test-package.ts << 'EOF'
          import { EmbexClient } from '@bridgerust/embex';

          console.log('[TEST] Testing TypeScript usage...\n');

          const client = new EmbexClient('qdrant', 'http://localhost:6333', null);
          const collection = client.collection('test');

          console.log('[OK] TypeScript import and usage successful');
          EOF
            npx tsc --noEmit test-package.ts 2>&1 || echo "[WARN] TypeScript check skipped (types may not be available)"
          else
            echo "[WARN] npx not available, skipping TypeScript test"
          fi

  test-pypi:
    name: Test PyPI Package
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Create test directory
        run: |
          mkdir -p test-pypi-package
          cd test-pypi-package

      - name: Create virtual environment
        working-directory: test-pypi-package
        shell: bash
        run: |
          python -m venv venv
          echo "[OK] Virtual environment created"

      - name: Install embex from PyPI
        working-directory: test-pypi-package
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            PYTHON_BIN="venv/Scripts/python"
          else
            PYTHON_BIN="venv/bin/python"
          fi

          echo "Using Python at: $PYTHON_BIN"

          if [ -n "${{ github.event.inputs.pypi_version }}" ]; then
            "$PYTHON_BIN" -m pip install embex==${{ github.event.inputs.pypi_version }}
          else
            "$PYTHON_BIN" -m pip install embex
          fi
          echo "[OK] Package installed from PyPI"

      - name: Verify package installation
        working-directory: test-pypi-package
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            PYTHON_BIN="venv/Scripts/python"
          else
            PYTHON_BIN="venv/bin/python"
          fi

          echo "[INFO] Installed package info:"
          "$PYTHON_BIN" -m pip show embex
          echo ""
          echo "[INFO] Package location:"
          # Use a robust check script that provides better debugging info
          "$PYTHON_BIN" -c "
          import sys
          import os
          try:
              import embex
              print(f'[OK] Import successful: {embex.__file__}')
          except ImportError as e:
              print(f'[ERR] Import failed: {e}')
              print(f'   sys.path: {sys.path}')
              try:
                  import site
                  packages = site.getsitepackages()
                  print(f'   site-packages: {packages}')
                  for p in packages:
                      if os.path.exists(p):
                          print(f'   Contents of {p}:')
                          try:
                             # Limit output
                             files = os.listdir(p)
                             embex_files = [f for f in files if 'embex' in f]
                             print(f'     Embex related: {embex_files}')
                          except Exception as list_err:
                             print(f'     Error listing: {list_err}')
              except Exception as debug_err:
                  print(f'   Debug error: {debug_err}')
              sys.exit(1)
          "

      - name: Create test script
        working-directory: test-pypi-package
        shell: bash
        run: |
          cat > test_package.py << 'EOF'
          """Test script to verify embex package from PyPI works correctly."""
          import sys

          print('Testing embex package from PyPI...\n')

          # Test 1: Import works
          try:
              from embex import EmbexClient, Point, Collection, SearchResult, DataMigrator
              print('Test 1: Import successful')
              print(f'   - EmbexClient: {EmbexClient}')
              print(f'   - Point: {Point}')
              print(f'   - Collection: {Collection}')
              print(f'   - SearchResult: {SearchResult}')
              print(f'   - DataMigrator: {DataMigrator}')
          except ImportError as e:
              print(f'Test 1 failed: Import error - {e}')
              sys.exit(1)

          # Test 2: Point can be created
          try:
              point = Point(id="test_1", vector=[0.1, 0.2, 0.3], metadata={"key": "value"})
              print('Test 2: Point creation successful')
              print(f'   - Point ID: {point.id}')
              print(f'   - Vector length: {len(point.vector)}')
              print(f'   - Metadata: {point.metadata}')
          except Exception as e:
              print(f'Test 2 failed: {e}')
              sys.exit(1)

          # Test 3: Client can be instantiated
          try:
              client = EmbexClient(provider="qdrant", url="http://localhost:6333")
              print('Test 3: Client instantiation successful')
              print(f'   - Client type: {type(client)}')
              print(f'   - Has collection method: {hasattr(client, "collection")}')
          except Exception as e:
              print(f'Test 3 failed: {e}')
              sys.exit(1)

          # Test 4: Collection can be created
          try:
              client = EmbexClient(provider="qdrant", url="http://localhost:6333")
              collection = client.collection("test_collection")
              print('Test 4: Collection creation successful')
              print(f'   - Collection type: {type(collection)}')
              print(f'   - Has insert method: {hasattr(collection, "insert")}')
              print(f'   - Has search method: {hasattr(collection, "search")}')
              print(f'   - Has query method: {hasattr(collection, "query")}')
              print(f'   - Has scroll method: {hasattr(collection, "scroll")}')
          except Exception as e:
              print(f'Test 4 failed: {e}')
              sys.exit(1)

          # Test 5: Check async methods exist
          try:
              import inspect
              client = EmbexClient(provider="qdrant", url="http://localhost:6333")
              collection = client.collection("test_collection")
              
              if hasattr(collection, 'insert'):
                  is_async = inspect.iscoroutinefunction(collection.insert)
                  print(f'Test 5: Method inspection successful')
                  print(f'   - insert is async: {is_async}')
          except Exception as e:
              print(f'Test 5 warning: {e}')

          # Test 6: Check async initialization method exists
          try:
              if not hasattr(EmbexClient, 'new_async'):
                  raise Exception('EmbexClient.new_async method not found')
              print('Test 6: Async initialization method exists')
              print(f'   - new_async type: {type(EmbexClient.new_async)}')
              print(f'   - Is static method: {inspect.ismethod(EmbexClient.new_async) or inspect.isfunction(EmbexClient.new_async)}')
          except Exception as e:
              print(f'Test 6 failed: {e}')
              sys.exit(1)

          # Test 7: Test async initialization (syntax check)
          try:
              import asyncio
              
              async def test_async_init():
                  try:
                      # Test that new_async is awaitable
                      # new_async requires provider and url as separate arguments
                      client = await EmbexClient.new_async(provider="lancedb", url="./test-data")
                      print('Test 7: Async initialization successful')
                      print(f'   - Client created via new_async: {type(client)}')
                      print(f'   - Has collection method: {hasattr(client, "collection")}')
                      return True
                  except Exception as e:
                      # Expected to fail without actual DB, but syntax is correct
                      if 'lancedb' in str(e).lower() or 'connection' in str(e).lower() or 'enoent' in str(e).lower():
                          print('Test 7: Async initialization syntax correct')
                          print('   - new_async is awaitable')
                          print('   - Can be called (connection error expected without DB)')
                          return True
                      else:
                          raise
              
              result = asyncio.run(test_async_init())
              if not result:
                  raise Exception('Async initialization test failed')
          except Exception as e:
              print(f'Test 7 failed: {e}')
              sys.exit(1)

          print('\nAll basic tests passed!')
          print('\nNote: Full integration tests require a running database server.')
          print('   To test with a real database, start Qdrant:')
          print('   docker run -p 6333:6333 qdrant/qdrant')
          EOF
          cat test_package.py

      - name: Run PyPI package tests
        working-directory: test-pypi-package
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            PYTHON_BIN="venv/Scripts/python"
          else
            PYTHON_BIN="venv/bin/python"
          fi
          "$PYTHON_BIN" test_package.py

      - name: Test package metadata
        working-directory: test-pypi-package
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            PYTHON_BIN="venv/Scripts/python"
          else
            PYTHON_BIN="venv/bin/python"
          fi
          "$PYTHON_BIN" -c "
          import embex
          print('[INFO] Package metadata:')
          print(f'   - Version: {getattr(embex, \"__version__\", \"unknown\")}')
          print(f'   - File: {embex.__file__}')
          print(f'   - Package: {embex.__package__}')
          "

  summary:
    name: Test Summary
    runs-on: ubuntu-latest
    needs: [test-npm, test-pypi]
    if: always()

    steps:
      - name: Check test results
        run: |
          echo "[STATS] Test Summary"
          echo "==============="
          echo "npm tests: ${{ needs.test-npm.result }}"
          echo "PyPI tests: ${{ needs.test-pypi.result }}"

          if [ "${{ needs.test-npm.result }}" != "success" ] || [ "${{ needs.test-pypi.result }}" != "success" ]; then
            echo "[ERR] Some tests failed!"
            exit 1
          else
            echo "[OK] All tests passed!"
          fi
