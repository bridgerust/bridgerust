name: Date parser migration parity

on:
  push:
    branches: [main, develop]
    paths: &parity-paths
      - "cli/bridge/**"
      - "crates/bridgerust/**"
      - "crates/bridgerust-macros/**"
      - "examples/date-parity/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/date-parity.yml"
  pull_request:
    paths: *parity-paths
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: date-parity-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  parity:
    name: Installed Python and Node packages (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      CARGO_INCREMENTAL: "0"
      PYTHONNOUSERSITE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Test the Bridge CLI
        run: cargo test --locked -p bridge

      - name: Install the Python build tool
        run: python -m pip install "maturin>=1.9,<2"

      - name: Build the wheel and pack the native Node addon
        shell: python
        run: |
          import os
          from pathlib import Path
          import shutil
          import subprocess

          example = Path('examples/date-parity').resolve()
          output = Path(os.environ['RUNNER_TEMP']) / 'date-parity'
          wheels = output / 'wheels'
          tarballs = output / 'tarballs'
          wheels.mkdir(parents=True)
          tarballs.mkdir()

          maturin = shutil.which('maturin')
          npm = shutil.which('npm.cmd' if os.name == 'nt' else 'npm')
          wheel_env = dict(os.environ, CARGO_PROFILE_RELEASE_STRIP='none')
          subprocess.run([maturin, 'build', '--locked', '--release', '--out', str(wheels)],
                         cwd=example / 'python', env=wheel_env, check=True)
          subprocess.run([npm, 'run', 'build'], cwd=example / 'nodejs', check=True)
          subprocess.run([npm, 'pack', '--ignore-scripts', '--pack-destination', str(tarballs)],
                         cwd=example / 'nodejs', check=True)

      - name: Install the artifacts in isolated consumers
        shell: python
        run: |
          import os
          from pathlib import Path
          import shutil
          import subprocess
          import sys

          output = Path(os.environ['RUNNER_TEMP']) / 'date-parity'
          venv = output / 'venv'
          node_consumer = output / 'node-consumer'
          wheel, = (output / 'wheels').glob('*.whl')
          tarball, = (output / 'tarballs').glob('*.tgz')
          npm = shutil.which('npm.cmd' if os.name == 'nt' else 'npm')

          subprocess.run([sys.executable, '-m', 'venv', str(venv)], check=True)
          bin_dir = venv / ('Scripts' if os.name == 'nt' else 'bin')
          python = bin_dir / ('python.exe' if os.name == 'nt' else 'python')
          subprocess.run([str(python), '-m', 'pip', 'install', '--no-index', '--no-deps', str(wheel)],
                         check=True)
          subprocess.run([npm, 'install', '--prefix', str(node_consumer), '--offline',
                          '--ignore-scripts', '--no-package-lock', '--no-audit', '--no-fund', str(tarball)],
                         check=True)

          with open(os.environ['GITHUB_PATH'], 'a', encoding='utf-8') as path_file:
              print(bin_dir, file=path_file)
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as env_file:
              print(f'NODE_PATH={node_consumer / "node_modules"}', file=env_file)

      - name: Verify legacy and installed implementations
        shell: python
        run: |
          import json
          import os
          from pathlib import Path
          import subprocess
          import sys

          example = Path('examples/date-parity').resolve()
          output = Path(os.environ['RUNNER_TEMP']) / 'date-parity'
          reports = output / 'reports'
          reports.mkdir()

          subprocess.run([sys.executable, '-I', '-c',
                          'from pathlib import Path; import bridge_date_parity as mod; '
                          'assert Path(mod.__file__).resolve().is_relative_to(Path.cwd().resolve())'],
                         cwd=output / 'venv', check=True)
          subprocess.run(['node', '-e',
                          'const {realpathSync} = require("node:fs"); const {join} = require("node:path"); '
                          'require("node:assert/strict").equal(realpathSync(require.resolve("bridge-date-parity")), '
                          'realpathSync(join(process.env.NODE_PATH, "bridge-date-parity", "index.node")));'],
                         cwd=example / 'nodejs', check=True)

          def parity(manifest, report, **kwargs):
              return subprocess.run(['cargo', 'run', '--locked', '-p', 'bridge', '--', 'parity',
                                     '--manifest', str(example / manifest), '--report', str(reports / report)],
                                    **kwargs)

          parity('legacy-parity.json', 'legacy.json', check=True)
          parity('parity.json', 'installed.json', check=True)

          env = dict(os.environ, BRIDGE_PARITY_DEMO_REGRESSION='1')
          failure = parity('parity.json', 'intentional-regression.json', env=env)
          assert failure.returncode == 1, f'Expected the comparison to fail, got exit {failure.returncode}'
          report = json.loads((reports / 'intentional-regression.json').read_text(encoding='utf-8'))
          assert not report['passed']
          mismatches = [(target['target'], case['id']) for target in report['targets'] for case in target['mismatches']]
          assert mismatches == [('nodejs', 'missing-offset')], mismatches
          assert all(not target['errors'] for target in report['targets'])

      - name: Upload parity reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: date-parity-reports-${{ matrix.os }}
          path: ${{ runner.temp }}/date-parity/reports/*.json
          if-no-files-found: ignore

      - name: Upload installable packages
        uses: actions/upload-artifact@v4
        with:
          name: date-parity-packages-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/date-parity/wheels/*.whl
            ${{ runner.temp }}/date-parity/tarballs/*.tgz
          if-no-files-found: error
