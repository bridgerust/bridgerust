name: CI Tests

on:
  push:
    branches: [main, develop]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "examples/**"
      - "images/**"
      - "CHANGELOG.md"
      - "LICENSE*"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/workflows/release*.yml"
      - ".github/workflows/benchmarks.yml"
      - ".github/workflows/bridgerust-framework.yml"
      - "benchmarks/**"
      - "bindings/node/**/package.json"
      - "website/**"
      - "showcase/playground/**"
      - "crates/bridgerust/**"
      - "crates/bridgerust-macros/**"
      - "cli/bridge/**"
      - "tests/e2e/**"
      - "examples/bridgerust-example/**"
  pull_request:
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "examples/**"
      - "images/**"
      - "CHANGELOG.md"
      - "LICENSE*"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/workflows/release*.yml"
      - ".github/workflows/benchmarks.yml"
      - ".github/workflows/bridgerust-framework.yml"
      - "benchmarks/**"
      - "website/**"
      - "showcase/playground/**"
      - "crates/bridgerust/**"
      - "crates/bridgerust-macros/**"
      - "cli/bridge/**"
      - "tests/e2e/**"
      - "examples/bridgerust-example/**"

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10
  CARGO_BUILD_JOBS: 2
  RUSTFLAGS: "-C link-arg=-fuse-ld=lld"

jobs:
  test:
    name: Test Suite
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      redis:
        image: redis:7
        ports:
          - 6379/tcp
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          sudo docker system prune -af
          df -h

      - name: Install LLD
        run: sudo apt-get update && sudo apt-get install -y lld protobuf-compiler

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          cache-targets: false
          shared-key: "ci-v2"

      - name: Build and test workspace
        run: cargo test --workspace --no-fail-fast
        env:
          BRIDGEQ_REDIS_URL: redis://127.0.0.1:${{ job.services.redis.ports[6379] }}/
          BRIDGEQ_POSTGRES_URL: postgres://postgres:postgres@127.0.0.1:${{ job.services.postgres.ports[5432] }}/postgres

      - name: Check embex-bridge (Python)
        run: cargo check -p embex-bridge --features python

      - name: Check embex-bridge (Node.js)
        run: cargo check -p embex-bridge --features nodejs

      - name: Check bridgetime-bridge
        run: cargo check -p bridgetime-bridge

      - name: Check bridgetime-bridge (Python)
        run: cargo check -p bridgetime-bridge --features python

      - name: Check bridgetime-bridge (Node.js)
        run: cargo check -p bridgetime-bridge --features nodejs

      - name: Check disk space after
        if: always()
        run: df -h
