name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # Rust Core Tests
  rust-test:
    name: Rust Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        features: ["", "simd", "all"]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Build
        run: |
          if [ -z "${{ matrix.features }}" ]; then
            cargo build --workspace
          else
            cargo build --workspace --features ${{ matrix.features }}
          fi

      - name: Test
        run: |
          if [ -z "${{ matrix.features }}" ]; then
            cargo test --workspace --lib
          else
            cargo test --workspace --features ${{ matrix.features }} --lib
          fi

      - name: Test with SIMD (if enabled)
        if: matrix.features == 'simd' || matrix.features == 'all'
        run: cargo test --workspace --features ${{ matrix.features }} --lib

  # Format Check
  fmt:
    name: Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

  # Clippy Lint
  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Clippy check
        run: cargo clippy --workspace --all-features -- -D warnings

  # Python Bindings
  # Reduced matrix to save minutes - can expand later
  python:
    name: Python Bindings
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"] # Reduced from 4 to 2 versions
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install protobuf compiler
        # LanceDB requires protoc for building
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Install maturin
        run: pip install maturin

      - name: Build Python bindings
        working-directory: bindings/python/embex
        run: maturin build --features all --release

      - name: Install Python bindings
        working-directory: bindings/python/embex
        run: maturin develop --features all

      - name: Run Python tests
        working-directory: bindings/python/embex
        run: |
          pip install pytest pytest-asyncio
          pytest tests/ -v

  # Node.js Bindings
  # Reduced matrix to save minutes - can expand later
  nodejs:
    name: Node.js Bindings
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ["20", "22"] # Reduced from 3 to 2 versions
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        working-directory: bindings/node/@bridgerust/embex
        run: npm ci

      - name: Build Node.js bindings
        working-directory: bindings/node/@bridgerust/embex
        run: npm run build

      - name: Run Node.js unit tests
        working-directory: bindings/node/@bridgerust/embex
        run: npm run test:unit

      - name: Run Node.js integration tests (if databases available)
        working-directory: bindings/node/@bridgerust/embex
        run: npm run test:integration || echo "Integration tests skipped (no databases)"

  # Multi-platform Build
  # Only run on main branch to save minutes
  build-platforms:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build all crates
        run: cargo build --workspace --features all --release

  # Documentation Check
  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build documentation
        run: cargo doc --workspace --features all --no-deps

      - name: Check for broken links (if linkchecker available)
        run: |
          echo "Documentation built successfully"
          # Add link checking if needed

  # Security Audit
  security:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Run security audit
        run: cargo audit
        continue-on-error: true # Don't fail on warnings
