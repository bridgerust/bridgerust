name: Build BridgeQ Python Wheels

on:
  push:
    tags:
      - "bridgeq-v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "BridgeQ tag to publish (e.g., bridgeq-v0.1.0)"
        required: false
        type: string
      dry_run:
        description: "Build artifacts without publishing"
        type: boolean
        default: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  build-wheels:
    name: Build wheel for ${{ matrix.platform.os }} ${{ matrix.platform.target }}
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            os: macos

          - runner: macos-15
            target: aarch64-apple-darwin
            os: macos

          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            os: linux

          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            os: windows

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && !inputs.dry_run && format('refs/tags/{0}', inputs.tag) || github.ref }}

      - name: Free Disk Space (Linux only)
        if: matrix.platform.os == 'linux'
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          sudo docker system prune -af
          df -h

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform.target }}

      - name: Build wheels
        env:
          CARGO_PROFILE_RELEASE_STRIP: none
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          args: --locked --release --out dist
          sccache: "true"
          manylinux: auto
          working-directory: bindings/python/bridgeq
          rust-toolchain: stable

      - name: Smoke-test the built wheel
        shell: python
        run: |
          import pathlib
          import subprocess
          import sys
          import tempfile

          wheel, = pathlib.Path("bindings/python/bridgeq/dist").glob("*.whl")
          with tempfile.TemporaryDirectory() as directory:
              subprocess.run(
                  [sys.executable, "-m", "pip", "install", "--no-deps", "--target", directory, str(wheel)],
                  check=True,
              )
              subprocess.run(
                  [sys.executable, "-I", "-c", "import sys; sys.path.insert(0, sys.argv[1]); import bridgeq", directory],
                  check=True,
              )

      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.platform.target }}
          path: bindings/python/bridgeq/dist/*.whl
          retention-days: 7
          if-no-files-found: error

  build-sdist:
    name: Build source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && !inputs.dry_run && format('refs/tags/{0}', inputs.tag) || github.ref }}

      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
          working-directory: bindings/python/bridgeq

      - name: Upload sdist
        uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: bindings/python/bridgeq/dist/*.tar.gz
          retention-days: 7
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: [build-wheels, build-sdist]
    if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/bridgeq-v')) || (github.event_name == 'workflow_dispatch' && !inputs.dry_run && startsWith(inputs.tag, 'bridgeq-v'))
    environment:
      name: BRIDGE_RUST
      url: https://pypi.org/project/bridgeq
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && !inputs.dry_run && format('refs/tags/{0}', inputs.tag) || github.ref }}

      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist

      - uses: actions/download-artifact@v4
        with:
          name: sdist
          path: dist

      - name: Verify tag/version alignment
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          TAG_NAME="$RELEASE_TAG"
          TAG_VERSION="${TAG_NAME#bridgeq-v}"
          PYPROJECT_PATH="bindings/python/bridgeq/pyproject.toml"

          if [ ! -f "$PYPROJECT_PATH" ]; then
            echo "Missing pyproject manifest: $PYPROJECT_PATH"
            exit 1
          fi

          PYPROJECT_VERSION=$(grep -E '^version = "' "$PYPROJECT_PATH" | head -1 | sed -E 's/version = "([^"]+)"/\1/')

          if [ "$TAG_VERSION" != "$PYPROJECT_VERSION" ]; then
            echo "Tag version ($TAG_VERSION) does not match pyproject version ($PYPROJECT_VERSION)"
            exit 1
          fi
          echo "Version check passed: $TAG_VERSION"

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
          skip-existing: true
