name: Build Node.js Bindings

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  build:
    name: Build ${{ matrix.settings.target }}
    runs-on: ${{ matrix.settings.host }}
    strategy:
      fail-fast: false
      matrix:
        settings:
          # macOS
          - host: macos-15-intel
            target: x86_64-apple-darwin

          - host: macos-14
            target: aarch64-apple-darwin

          # Linux
          - host: ubuntu-latest
            target: x86_64-unknown-linux-gnu

          - host: ubuntu-latest
            target: x86_64-unknown-linux-musl

          #   - host: ubuntu-latest
          #     target: aarch64-unknown-linux-gnu

          # Windows
          - host: windows-latest
            target: x86_64-pc-windows-msvc

    steps:
      - uses: actions/checkout@v4

      - name: Free Disk Space (Linux)
        if: matrix.settings.host == 'ubuntu-latest'
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          df -h

      # Setup Bun (replaces Node.js setup)
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.settings.target }}

      - name: Install protobuf
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            sudo apt-get update && sudo apt-get install -y protobuf-compiler
          elif [[ "$RUNNER_OS" == "macOS" ]]; then
            brew install protobuf
          elif [[ "$RUNNER_OS" == "Windows" ]]; then
            choco install protoc -y
          fi

      - name: Setup toolchain (musl)
        if: matrix.settings.target == 'x86_64-unknown-linux-musl'
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      - name: Setup toolchain (ARM64)
        if: matrix.settings.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      # Install dependencies with Bun (MUCH FASTER)
      - name: Install dependencies
        working-directory: bindings/node/@bridgerust/embex
        run: bun install
        # Bun doesn't have the npm ci sync issues!

      - name: Build
        working-directory: bindings/node/@bridgerust/embex
        shell: bash
        run: |
          bunx @napi-rs/cli build --target ${{ matrix.settings.target }} --release --strip --js native.js --dts native.d.ts
          bun run -b tsc || true
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: bindings-${{ matrix.settings.target }}
          path: bindings/node/@bridgerust/embex/*.node
          retention-days: 1

  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    needs: [build]
    if: startsWith(github.ref, 'refs/tags/v')
    environment:
      name: npm
      url: https://npmjs.com/package/@bridgerust/embex

    steps:
      - uses: actions/checkout@v4

      # Setup Bun for publishing
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: bindings-*
          path: artifacts

      - name: Move artifacts
        working-directory: bindings/node/@bridgerust/embex
        shell: bash
        run: |
          mkdir -p .
          for dir in ../../../../artifacts/bindings-*/; do
            if [ -d "$dir" ]; then
              cp -v "$dir"*.node . || true
            fi
          done
          ls -la *.node

      - name: Verify artifacts
        working-directory: bindings/node/@bridgerust/embex
        run: |
          if [ ! -f *.node ]; then
            echo "ERROR: No .node files found!"
            exit 1
          fi
          echo "Found artifacts:"
          ls -lh *.node

      - name: Install dependencies
        working-directory: bindings/node/@bridgerust/embex
        run: bun install

      - name: Prepare platform packages
        working-directory: bindings/node/@bridgerust/embex
        shell: bash
        run: |
          mkdir -p npm/darwin-arm64 npm/darwin-x64 npm/linux-x64-gnu npm/linux-x64-musl npm/win32-x64-msvc
          cp embex.aarch64-apple-darwin.node npm/darwin-arm64/embex.darwin-arm64.node 2>/dev/null || true
          cp embex.x86_64-apple-darwin.node npm/darwin-x64/embex.darwin-x64.node 2>/dev/null || true
          cp embex.x86_64-unknown-linux-gnu.node npm/linux-x64-gnu/embex.linux-x64-gnu.node 2>/dev/null || true
          cp embex.x86_64-unknown-linux-musl.node npm/linux-x64-musl/embex.linux-x64-musl.node 2>/dev/null || true
          cp embex.x86_64-pc-windows-msvc.node npm/win32-x64-msvc/embex.win32-x64-msvc.node 2>/dev/null || true

      - name: Publish to npm
        working-directory: bindings/node/@bridgerust/embex
        run: |
          echo "//registry.npmjs.org/:_authToken=${{ secrets.NPM_TOKEN }}" > ~/.npmrc
          npm publish --access public || echo "Package already published, skipping"
        continue-on-error: true
