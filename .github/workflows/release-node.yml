name: Build Node.js Bindings

on:
  push:
    tags:
      - "embex-v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Embex tag to publish (e.g., embex-v0.1.18)"
        required: true
        type: string

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  build:
    name: Build ${{ matrix.settings.target }}
    runs-on: ${{ matrix.settings.host }}
    strategy:
      fail-fast: false
      matrix:
        settings:
          # macOS
          - host: macos-15-intel
            target: x86_64-apple-darwin

          - host: macos-14
            target: aarch64-apple-darwin

          # Linux
          - host: ubuntu-latest
            target: x86_64-unknown-linux-gnu

          - host: ubuntu-latest
            target: x86_64-unknown-linux-musl

          # Windows
          - host: windows-latest
            target: x86_64-pc-windows-msvc

    steps:
      - uses: actions/checkout@v4

      - name: Free Disk Space (Linux)
        if: matrix.settings.host == 'ubuntu-latest'
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          df -h

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: bindings/node/@bridgerust/embex/package-lock.json

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.settings.target }}

      - name: Install protobuf
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            sudo apt-get update && sudo apt-get install -y protobuf-compiler
          elif [[ "$RUNNER_OS" == "macOS" ]]; then
            brew install protobuf
          elif [[ "$RUNNER_OS" == "Windows" ]]; then
            choco install protoc -y
          fi

      - name: Setup toolchain (musl)
        if: matrix.settings.target == 'x86_64-unknown-linux-musl'
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      - name: Install dependencies
        working-directory: bindings/node/@bridgerust/embex
        run: npm ci

      - name: Build
        working-directory: bindings/node/@bridgerust/embex
        shell: bash
        run: |
          npx @napi-rs/cli build --target ${{ matrix.settings.target }} --release --strip --js native.js --dts native.d.ts
          npx tsc || true

          # Debug: Show what files were created
          echo "📦 Built files:"
          ls -la *.node || echo "No .node files found!"

          # Rename to target triple for uniqueness
          for file in *.node; do
            if [ -f "$file" ]; then
              mv "$file" "embex.${{ matrix.settings.target }}.node"
              echo "✅ Renamed: $file → embex.${{ matrix.settings.target }}.node"
            fi
          done

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: bindings-${{ matrix.settings.target }}
          path: bindings/node/@bridgerust/embex/embex.${{ matrix.settings.target }}.node
          retention-days: 1

  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    needs: [build]
    if: startsWith(github.ref, 'refs/tags/embex-v') || (github.event_name == 'workflow_dispatch' && startsWith(github.event.inputs.tag, 'embex-v'))
    environment:
      name: npm
      url: https://npmjs.com/package/@bridgerust/embex

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: bindings/node/@bridgerust/embex/package-lock.json

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: bindings-*
          path: artifacts

      - name: Move artifacts
        working-directory: bindings/node/@bridgerust/embex
        shell: bash
        run: |
          echo "🔍 Downloaded artifacts:"
          find ${{ github.workspace }}/artifacts -type f -name "*.node" -exec ls -lh {} \;

          # Copy all .node files to current directory
          find ${{ github.workspace }}/artifacts -name "*.node" -exec cp -v {} . \;

          echo "📂 Files in working directory:"
          ls -lh *.node

      - name: Verify artifacts
        working-directory: bindings/node/@bridgerust/embex
        run: |
          COUNT=$(ls -1 *.node 2>/dev/null | wc -l)
          if [ "$COUNT" -eq 0 ]; then
            echo "❌ ERROR: No .node files found!"
            exit 1
          fi
          echo "✅ Found $COUNT .node file(s)"

      - name: Install dependencies
        working-directory: bindings/node/@bridgerust/embex
        run: npm ci

      - name: Build TypeScript
        working-directory: bindings/node/@bridgerust/embex
        run: |
          echo "🔨 Building TypeScript to dist/..."
          npx tsc
          echo "✅ TypeScript build complete"
          if [ -d "dist" ]; then
            echo "📦 dist/ folder contents:"
            find dist -type f | head -20
          else
            echo "⚠️  dist/ folder not created!"
            exit 1
          fi

          # Copy native.js and native.d.ts to dist/ so compiled code can find them
          if [ -f "native.js" ]; then
            cp native.js dist/native.js
            echo "✅ Copied native.js to dist/"
          else
            echo "⚠️  native.js not found in root"
          fi

          if [ -f "native.d.ts" ]; then
            cp native.d.ts dist/native.d.ts
            echo "✅ Copied native.d.ts to dist/"
          else
            echo "⚠️  native.d.ts not found in root"
          fi

          # Verify required files exist
          if [ ! -f "dist/index.js" ]; then
            echo "❌ ERROR: dist/index.js not found!"
            exit 1
          fi
          if [ ! -f "dist/index.d.ts" ]; then
            echo "❌ ERROR: dist/index.d.ts not found!"
            echo "   TypeScript declaration files are required for TypeScript users."
            exit 1
          fi
          if [ ! -f "dist/native.js" ]; then
            echo "❌ ERROR: dist/native.js not found!"
            echo "   Required for compiled code to import native bindings."
            exit 1
          fi
          echo "✅ Verified dist/index.js, dist/index.d.ts, and dist/native.js exist"

      - name: Prepare platform packages
        working-directory: bindings/node/@bridgerust/embex
        shell: bash
        run: |
          # Create platform directories
          mkdir -p npm/darwin-arm64 npm/darwin-x64 npm/linux-x64-gnu npm/linux-x64-musl npm/win32-x64-msvc

          # Copy and rename binaries
          cp embex.aarch64-apple-darwin.node npm/darwin-arm64/embex.darwin-arm64.node
          cp embex.x86_64-apple-darwin.node npm/darwin-x64/embex.darwin-x64.node
          cp embex.x86_64-unknown-linux-gnu.node npm/linux-x64-gnu/embex.linux-x64-gnu.node
          cp embex.x86_64-unknown-linux-musl.node npm/linux-x64-musl/embex.linux-x64-musl.node
          cp embex.x86_64-pc-windows-msvc.node npm/win32-x64-msvc/embex.win32-x64-msvc.node

          echo "✅ Platform packages prepared:"
          find npm -name "*.node" -exec ls -lh {} \;

          # CLEAN UP: Remove .node files from root before publishing main package
          rm -f *.node
          echo "✅ Cleaned up binaries from root directory"

      - name: Publish platform packages
        working-directory: bindings/node/@bridgerust/embex
        shell: bash
        env:
          GITHUB_REF_NAME: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}
        run: |
          echo "//registry.npmjs.org/:_authToken=${{ secrets.NPM_TOKEN }}" > ~/.npmrc
          bash $GITHUB_WORKSPACE/.github/scripts/publish-npm-platforms.sh

      - name: Publish main package
        working-directory: bindings/node/@bridgerust/embex
        run: |
          # Verify no .node files in root
          if ls *.node 2>/dev/null; then
            echo "❌ ERROR: .node files still present!"
            exit 1
          fi

          # Verify dist/ folder exists with required files
          if [ ! -f "dist/index.js" ]; then
            echo "❌ ERROR: dist/index.js not found!"
            echo "   This file is required as the main entry point."
            echo "   Make sure TypeScript compilation succeeded."
            exit 1
          fi
          if [ ! -f "dist/index.d.ts" ]; then
            echo "❌ ERROR: dist/index.d.ts not found!"
            echo "   This file is required for TypeScript support."
            echo "   Make sure TypeScript compilation with declaration files succeeded."
            exit 1
          fi
          echo "✅ Verified dist/index.js and dist/index.d.ts exist"

          TAG_NAME="${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}"
          VERSION=${TAG_NAME#embex-v}
          npm version $VERSION --no-git-tag-version --allow-same-version

          # Keep platform optionalDependencies aligned with the published version
          npm pkg set optionalDependencies."@bridgerust/embex-darwin-arm64"="$VERSION"
          npm pkg set optionalDependencies."@bridgerust/embex-darwin-x64"="$VERSION"
          npm pkg set optionalDependencies."@bridgerust/embex-linux-x64-gnu"="$VERSION"
          npm pkg set optionalDependencies."@bridgerust/embex-linux-x64-musl"="$VERSION"
          npm pkg set optionalDependencies."@bridgerust/embex-win32-x64-msvc"="$VERSION"

          echo "//registry.npmjs.org/:_authToken=${{ secrets.NPM_TOKEN }}" > ~/.npmrc
          npm publish --access public
