name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g., 0.2.0)"
        required: true
        type: string

env:
  CARGO_TERM_COLOR: always

jobs:
  # Verify release readiness
  verify:
    name: Verify Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy check
        run: cargo clippy --workspace --all-features -- -D warnings

      - name: Run tests
        run: cargo test --workspace --all-features

  # Build Rust crates
  build-rust:
    name: Build Rust Crates
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build all crates
        run: cargo build --workspace --features all --release

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rust-builds
          path: target/release/

  # Build Python bindings
  build-python:
    name: Build Python Bindings
    runs-on: ubuntu-latest
    needs: verify
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install maturin
        run: pip install maturin

      - name: Build wheels
        working-directory: bindings/python/kabod
        run: maturin build --features all --release

      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: python-wheels-${{ matrix.os }}-${{ matrix.python-version }}
          path: bindings/python/kabod/target/wheels/*.whl

  # Build Node.js bindings
  build-nodejs:
    name: Build Node.js Bindings
    runs-on: ubuntu-latest
    needs: verify
    strategy:
      matrix:
        node-version: ["18", "20", "22"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        working-directory: bindings/node/@bridgerust/kabod
        run: npm ci

      - name: Build bindings
        working-directory: bindings/node/@bridgerust/kabod
        run: npm run build

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nodejs-builds-${{ matrix.node-version }}
          path: bindings/node/@bridgerust/kabod/

  # Publish to crates.io (manual approval required)
  publish-crates:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    needs: [verify, build-rust]
    if: startsWith(github.ref, 'refs/tags/v')
    environment:
      name: crates-io
      url: https://crates.io
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Publish to crates.io
        run: |
          echo "Publishing to crates.io..."
          # Add actual publish commands for each crate
          # cargo publish --package bridge-core
          # cargo publish --package bridge-kabod-core
          # etc.
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}

  # Publish to PyPI (manual approval required)
  publish-pypi:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: [verify, build-python]
    if: startsWith(github.ref, 'refs/tags/v')
    environment:
      name: pypi
      url: https://pypi.org
    steps:
      - uses: actions/checkout@v4

      - name: Download all wheels
        uses: actions/download-artifact@v4
        with:
          pattern: python-wheels-*
          merge-multiple: true

      - name: Publish to PyPI
        run: |
          pip install twine
          twine upload python-wheels-*/*.whl
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}

  # Publish to npm (manual approval required)
  publish-npm:
    name: Publish to npm
    runs-on: ubuntu-latest
    needs: [verify, build-nodejs]
    if: startsWith(github.ref, 'refs/tags/v')
    environment:
      name: npm
      url: https://www.npmjs.com
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: nodejs-builds-*
          merge-multiple: true

      - name: Publish to npm
        working-directory: bindings/node/@bridgerust/kabod
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  # Create GitHub Release
  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [verify]
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract version
        id: version
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Generate release notes
        id: release-notes
        run: |
          if [ -f RELEASE_NOTES.md ]; then
            cat RELEASE_NOTES.md > release_notes.txt
          elif [ -f CHANGELOG.md ]; then
            # Extract version section from CHANGELOG
            awk "/^## Version ${{ steps.version.outputs.version }}/,/^## Version /" CHANGELOG.md | head -n -1 > release_notes.txt
          else
            echo "Release v${{ steps.version.outputs.version }}" > release_notes.txt
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          body_path: release_notes.txt
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
