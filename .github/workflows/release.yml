name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g., 0.2.0)"
        required: true
        type: string

env:
  CARGO_TERM_COLOR: always

jobs:
  # Verify release readiness
  verify:
    name: Verify Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy check
        run: cargo clippy --workspace --all-features -- -D warnings

      - name: Run tests
        run: cargo test --workspace --all-features

  # Build Rust crates
  build-rust:
    name: Build Rust Crates
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build all crates
        run: cargo build --workspace --features all --release

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rust-builds
          path: target/release/

  # Build Python bindings
  build-python:
    name: Build Python Bindings
    runs-on: ubuntu-latest
    needs: verify
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install maturin
        run: pip install maturin

      - name: Build wheels
        working-directory: bindings/python/embex
        run: maturin build --features all --release --strip

      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: python-wheels-${{ matrix.os }}-${{ matrix.python-version }}
          path: bindings/python/embex/target/wheels/*.whl

  # Build Node.js bindings for all platforms
  build-nodejs:
    name: Build Node.js Bindings
    needs: verify
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            name: linux-x64-musl
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            name: linux-arm64-musl
          - os: ubuntu-latest
            target: armv7-unknown-linux-gnueabihf
            name: linux-arm-gnueabihf
          - os: macos-latest
            target: aarch64-apple-darwin
            name: darwin-arm64
          - os: macos-latest
            target: x86_64-apple-darwin
            name: darwin-x64
          - os: windows-latest
            target: i686-pc-windows-msvc
            name: win32-ia32-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install dependencies
        working-directory: bindings/node/@bridgerust/embex
        run: npm ci

      - name: Build for ${{ matrix.target }}
        working-directory: bindings/node/@bridgerust/embex
        run: |
          # Build for specific target with optimizations
          napi build --target ${{ matrix.target }} --release --js native.js --dts native.d.ts
          # Build TypeScript
          npm run build --if-present || tsc || true

      - name: Prepare platform package
        working-directory: bindings/node/@bridgerust/embex
        shell: bash
        run: |
          # Create npm directory structure for this platform
          mkdir -p npm/${{ matrix.name }}
          # Copy the built binary to the platform-specific directory
          # napi build creates binaries with pattern: embex.<target>.node
          # We need to find the correct binary and rename it
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            # Windows: look for win32-ia32.node or i686-pc-windows-msvc.node
            if [ -f "embex.win32-ia32.node" ]; then
              cp embex.win32-ia32.node npm/${{ matrix.name }}/embex.${{ matrix.name }}.node
            elif [ -f "embex.i686-pc-windows-msvc.node" ]; then
              cp embex.i686-pc-windows-msvc.node npm/${{ matrix.name }}/embex.${{ matrix.name }}.node
            else
              # Try to find any .node file
              for f in embex.*.node; do
                if [ -f "$f" ]; then
                  cp "$f" npm/${{ matrix.name }}/embex.${{ matrix.name }}.node
                  break
                fi
              done
            fi
          else
            # Unix: use find command (works on macOS and Linux)
            BINARY=$(find . -maxdepth 1 -name "embex.*.node" -type f | head -1)
            if [ -n "$BINARY" ]; then
              cp "$BINARY" npm/${{ matrix.name }}/embex.${{ matrix.name }}.node
            else
              echo "ERROR: No binary found for ${{ matrix.target }}"
              exit 1
            fi
          fi
          # Verify the binary was copied
          if [ ! -f "npm/${{ matrix.name }}/embex.${{ matrix.name }}.node" ]; then
            echo "ERROR: Failed to copy binary for ${{ matrix.name }}"
            ls -la *.node || echo "No .node files found"
            exit 1
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nodejs-${{ matrix.name }}
          path: bindings/node/@bridgerust/embex/npm/${{ matrix.name }}/
          retention-days: 7

  # Publish to crates.io (manual approval required)
  publish-crates:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    needs: [verify, build-rust]
    if: startsWith(github.ref, 'refs/tags/v')
    environment:
      name: crates-io
      url: https://crates.io
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Publish to crates.io
        run: |
          echo "Publishing to crates.io..."
          # Add actual publish commands for each crate
          # cargo publish --package bridge-core
          # cargo publish --package bridge-kabod-core
          # etc.
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}

  # Publish to PyPI (manual approval required)
  publish-pypi:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: [verify, build-python]
    if: startsWith(github.ref, 'refs/tags/v')
    environment:
      name: pypi
      url: https://pypi.org
    steps:
      - uses: actions/checkout@v4

      - name: Download all wheels
        uses: actions/download-artifact@v7
        with:
          pattern: python-wheels-*
          merge-multiple: true
          path: python-wheels

      - name: Publish to PyPI
        run: |
          pip install twine
          # Find all wheels in the downloaded artifacts
          find python-wheels -name "*.whl" -type f -exec twine upload {} \;
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}

  # Publish to npm (manual approval required)
  publish-npm:
    name: Publish to npm
    runs-on: ubuntu-latest
    needs: [verify, build-nodejs]
    if: startsWith(github.ref, 'refs/tags/v')
    environment:
      name: npm
      url: https://www.npmjs.com
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Download all platform artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: nodejs-*
          merge-multiple: false
          path: nodejs-artifacts

      - name: Assemble platform packages
        working-directory: bindings/node/@bridgerust/embex
        run: |
          # Create npm directory structure
          mkdir -p npm
          # Copy all platform binaries to their respective directories
          # Artifacts are downloaded to nodejs-artifacts/ directory
          for dir in ../../nodejs-artifacts/nodejs-*/; do
            if [ -d "$dir" ]; then
              platform=$(basename "$dir" | sed 's/nodejs-//')
              echo "Copying binaries for platform: $platform"
              mkdir -p "npm/$platform"
              # Copy all files from the artifact directory
              cp -r "$dir"* "npm/$platform/" 2>/dev/null || true
              # Verify we have the binary
              if [ -f "npm/$platform/embex.$platform.node" ]; then
                echo "✅ Found binary for $platform"
              else
                echo "⚠️  Binary not found for $platform, listing contents:"
                ls -la "npm/$platform/" || true
              fi
            fi
          done
          # List what we have
          echo "📦 Assembled packages:"
          find npm -type f || echo "No binaries found"

      - name: Build main package
        working-directory: bindings/node/@bridgerust/embex
        run: |
          # Build TypeScript
          npm run build --if-present || tsc || true
          # Run prepublish to create platform-specific packages
          napi prepublish -t npm || echo "Prepublish completed (warnings expected)"

      - name: Publish platform-specific packages
        working-directory: bindings/node/@bridgerust/embex
        run: |
          # Publish each platform-specific package
          for dir in npm/*/; do
            if [ -d "$dir" ] && [ -f "$dir/package.json" ]; then
              echo "Publishing $(basename "$dir")..."
              cd "$dir"
              npm publish --access public || echo "Failed or already published"
              cd - > /dev/null
            fi
          done

      - name: Publish main package
        working-directory: bindings/node/@bridgerust/embex
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  # Create GitHub Release
  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [verify]
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract version
        id: version
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Generate release notes
        id: release-notes
        run: |
          if [ -f RELEASE_NOTES.md ]; then
            cat RELEASE_NOTES.md > release_notes.txt
          elif [ -f CHANGELOG.md ]; then
            # Extract version section from CHANGELOG
            awk "/^## Version ${{ steps.version.outputs.version }}/,/^## Version /" CHANGELOG.md | head -n -1 > release_notes.txt
          else
            echo "Release v${{ steps.version.outputs.version }}" > release_notes.txt
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          body_path: release_notes.txt
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}
