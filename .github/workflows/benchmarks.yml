name: Benchmarks

on:
  schedule:
    - cron: "0 0 1 * *" # First day of every month at midnight UTC
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_BUILD_JOBS: 2
  RUSTFLAGS: "-C opt-level=2"

jobs:
  benchmark:
    name: Performance Benchmarks
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          df -h

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install protobuf compiler
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          shared-key: "benchmarks"

      - name: Install criterion
        run: cargo install cargo-criterion

      - name: Run SIMD benchmarks
        run: |
          cd benchmarks/embex
          cargo bench --bench simd_bench --features simd

      - name: Run comparison benchmarks
        run: |
          cd benchmarks/embex
          cargo bench --bench simd_comparison --features simd

      - name: Run native comparison benchmarks
        run: |
          cd benchmarks/embex
          cargo bench --bench native_comparison

      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: benchmarks/embex/target/criterion/
          retention-days: 30

      - name: Check disk space after
        if: always()
        run: df -h
